<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cắt &amp; đè ảnh nhiều khung</title>
    <style>
        :root {
            --bg: #f6f6f4;
            --card: #fff;
            --tx: #1d1d1b;
            --mut: #6b6b66;
            --bd: #d9d9d4;
            --ac: #2f6fed;
            --act: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #161615;
                --card: #222221;
                --tx: #ececea;
                --mut: #9a9a94;
                --bd: #3a3a38;
                --ac: #5b8dff
            }
        }

        :root[data-theme="dark"] {
            --bg: #161615;
            --card: #222221;
            --tx: #ececea;
            --mut: #9a9a94;
            --bd: #3a3a38;
            --ac: #5b8dff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            max-width: 900px;
            margin-inline: auto
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px
        }

        h2 {
            font-size: 15px;
            margin: 0 0 8px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px
        }

        .card.active {
            border-color: var(--ac);
            box-shadow: 0 0 0 1px var(--ac)
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin-bottom: 3px
        }

        input[type=number], input[type=file] {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx);
            font: inherit
        }

        .grid {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 10px
        }

        .row {
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--bd);
            border-radius: 8px;
            display: block;
            touch-action: none
        }

        button {
            background: var(--ac);
            color: var(--act);
            border: 0;
            border-radius: 8px;
            padding: 9px 14px;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        button.sec {
            background: transparent;
            color: var(--tx);
            border: 1px solid var(--bd)
        }

        button:disabled {
            opacity: .4;
            cursor: default
        }

        .hint {
            color: var(--mut);
            font-size: 13px;
            margin: 6px 0 8px
        }

        .head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex: none
        }

        .head b {
            flex: 1
        }

        .chk {
            display: flex;
            gap: 6px;
            align-items: center;
            color: var(--tx);
            font-size: 14px;
            margin-bottom: 10px
        }
    </style>
</head>
<body>
<h1>Cắt nhiều vùng từ ảnh 1 và đè lên ảnh 2</h1>

<div class="card row">
    <div><label>Ảnh nguồn (để cắt)</label><input type="file" id="fs" accept="image/*"></div>
    <div><label>Ảnh đích (để đè lên)</label><input type="file" id="fd" accept="image/*"></div>
</div>

<div class="card">
    <h2>Ảnh nguồn</h2>
    <p class="hint" id="info">Chọn ảnh nguồn, rồi chọn một khung bên dưới và kéo trên ảnh để đặt vùng cắt cho khung
        đó.</p>
    <canvas id="cs" width="10" height="10"></canvas>
</div>

<div id="layers"></div>
<p style="margin:0 0 12px">
    <button class="sec" id="add">+ Thêm khung</button>
</p>

<div class="card">
    <h2>Kết quả</h2>
    <canvas id="cr" width="10" height="10"></canvas>
    <p style="margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap">
        <button id="dl" disabled>Tải PNG</button>
        <button id="dj" disabled>Tải JPG</button>
    </p>
</div>

<script>
    const $ = id => document.getElementById(id);
    const COLORS = ["#ff3b30", "#34c759", "#ff9f0a", "#af52de", "#00b8d9", "#ff2d95"];
    const mk = (l, t, r, b) => ({l, t, r, b, auto: true, px: l, py: t, sc: 1, op: 100});
    let layers = [mk(60, 1555, 1030, 1830), mk(60, 1290, 1030, 1530)];
    let active = 0, src = null, dst = null;

    function load(file, cb) {
        if (!file) return;
        const img = new Image();
        img.onload = () => cb(img);
        img.src = URL.createObjectURL(file);
    }

    $("fs").onchange = e => load(e.target.files[0], img => {
        src = img;
        $("info").textContent = "Ảnh nguồn: " + img.width + "×" + img.height + " px. Chọn khung rồi kéo trên ảnh để đặt vùng cắt.";
        render()
    });
    $("fd").onchange = e => load(e.target.files[0], img => {
        dst = img;
        render()
    });

    const FIELDS = [["l", "Left"], ["t", "Top"], ["r", "Right"], ["b", "Bottom"]];
    const FIELDS2 = [["px", "Dán x"], ["py", "Dán y"], ["sc", "Tỉ lệ"], ["op", "Độ đục 0–100"]];

    function build() {
        const box = $("layers");
        box.innerHTML = "";
        layers.forEach((L, i) => {
            const d = document.createElement("div");
            d.className = "card" + (i === active ? " active" : "");
            const f = (arr, extra) => arr.map(([k, n]) => `<div><label>${n}</label><input type="number" data-i="${i}" data-k="${k}" value="${L[k]}" ${k === "sc" ? 'step="0.05" min="0.05"' : ""} ${(k === "px" || k === "py") && L.auto ? "disabled" : ""}></div>`).join("");
            d.innerHTML = `<div class="head"><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span><b>Khung ${i + 1}</b>
      <button class="sec" data-sel="${i}">${i === active ? "Đang chọn (kéo trên ảnh)" : "Chọn để kéo"}</button>
      <button class="sec" data-del="${i}" ${layers.length < 2 ? "disabled" : ""}>Xoá</button></div>
      <div class="grid">${f(FIELDS)}</div>
      <label class="chk"><input type="checkbox" data-i="${i}" data-k="auto" ${L.auto ? "checked" : ""}> Dán đúng vị trí cũ (x, y = Left, Top)</label>
      <div class="grid" style="margin:0">${f(FIELDS2)}</div>`;
            box.appendChild(d);
        });
    }

    $("layers").addEventListener("input", e => {
        const el = e.target, i = el.dataset.i;
        if (i === undefined) return;
        const L = layers[i], k = el.dataset.k;
        if (k === "auto") {
            L.auto = el.checked;
            build();
        } else L[k] = parseFloat(el.value) || 0;
        render(true);
    });
    $("layers").addEventListener("click", e => {
        const s = e.target.dataset.sel, d = e.target.dataset.del;
        if (s !== undefined) {
            active = +s;
            build();
            render(true)
        }
        if (d !== undefined && layers.length > 1) {
            layers.splice(+d, 1);
            active = Math.min(active, layers.length - 1);
            build();
            render(true)
        }
    });
    $("add").onclick = () => {
        layers.push(mk(60, 100, 1030, 400));
        active = layers.length - 1;
        build();
        render(true)
    };

    function crop(L) {
        if (!src) return null;
        const l = Math.max(0, Math.round(L.l)), t = Math.max(0, Math.round(L.t));
        const r = Math.min(src.width, Math.round(L.r)), b = Math.min(src.height, Math.round(L.b));
        return (r > l && b > t) ? {l, t, w: r - l, h: b - t} : null;
    }

    function render(keepInputs) {
        layers.forEach(L => {
            if (L.auto) {
                L.px = L.l;
                L.py = L.t
            }
        });
        if (keepInputs) document.querySelectorAll("#layers input[data-k=px],#layers input[data-k=py]").forEach(el => {
            const L = layers[el.dataset.i];
            if (L.auto) el.value = L[el.dataset.k]
        });
        // ảnh nguồn + các khung
        const cs = $("cs");
        if (src) {
            cs.width = src.width;
            cs.height = src.height;
            const x = cs.getContext("2d");
            x.drawImage(src, 0, 0);
            x.fillStyle = "rgba(0,0,0,.45)";
            x.fillRect(0, 0, cs.width, cs.height);
            const lw = Math.max(2, src.width / 300);
            layers.forEach((L, i) => {
                const c = crop(L);
                if (!c) return;
                x.drawImage(src, c.l, c.t, c.w, c.h, c.l, c.t, c.w, c.h);
                x.strokeStyle = COLORS[i % COLORS.length];
                x.lineWidth = i === active ? lw * 1.8 : lw;
                x.strokeRect(c.l, c.t, c.w, c.h);
                x.fillStyle = COLORS[i % COLORS.length];
                x.font = "bold " + Math.round(src.width / 22) + "px sans-serif";
                x.fillText(i + 1, c.l + 8, c.t + Math.round(src.width / 22) + 4);
            });
        }
        // kết quả
        const cr = $("cr");
        if (!dst) {
            $("dl").disabled = $("dj").disabled = true;
            return
        }
        cr.width = dst.width;
        cr.height = dst.height;
        const g = cr.getContext("2d");
        g.drawImage(dst, 0, 0);
        g.imageSmoothingQuality = "high";
        let any = false;
        layers.forEach(L => {
            const c = crop(L);
            if (!c) return;
            any = true;
            const s = Math.max(0.05, L.sc || 1);
            g.globalAlpha = Math.min(100, Math.max(0, L.op)) / 100;
            g.drawImage(src, c.l, c.t, c.w, c.h, L.px, L.py, c.w * s, c.h * s);
        });
        g.globalAlpha = 1;
        $("dl").disabled = $("dj").disabled = !any;
    }

    // kéo chọn vùng cho khung đang chọn
    let drag = null;
    const pt = e => {
        const R = $("cs").getBoundingClientRect(), k = $("cs").width / R.width;
        return {x: Math.round((e.clientX - R.left) * k), y: Math.round((e.clientY - R.top) * k)}
    };
    $("cs").addEventListener("pointerdown", e => {
        if (!src) return;
        drag = pt(e);
        $("cs").setPointerCapture(e.pointerId)
    });
    $("cs").addEventListener("pointermove", e => {
        if (!drag) return;
        const p = pt(e), L = layers[active];
        L.l = Math.max(0, Math.min(drag.x, p.x));
        L.t = Math.max(0, Math.min(drag.y, p.y));
        L.r = Math.min(src.width, Math.max(drag.x, p.x));
        L.b = Math.min(src.height, Math.max(drag.y, p.y));
        document.querySelectorAll(`#layers input[data-i="${active}"]`).forEach(el => {
            const k = el.dataset.k;
            if (k in L && k !== "auto") el.value = L[k]
        });
        render(true);
    });
    $("cs").addEventListener("pointerup", () => drag = null);

    function baseName() {
        const f = $("fd").files[0];
        return f ? f.name.replace(/\.[^.]+$/, "") : "ket_qua"
    }

    function save(type, ext) {
        const name = baseName() + "." + ext;
        $("cr").toBlob(bl => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(bl);
            a.download = name;
            a.click()
        }, type, 0.95);
    }

    $("dl").onclick = () => save("image/png", "png");
    $("dj").onclick = () => save("image/jpeg", "jpg");
    build();
    render();
</script>
</body>
</html>
